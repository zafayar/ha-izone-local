name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Actions are pinned to commit hashes (a tag or branch can be moved);
# the comment names the version, and Dependabot proposes updates. The
# token only needs to read the repo.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (fake bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install aiohttp voluptuous coverage
      - run: python -m unittest discover -s tests -v
      - name: Coverage (each scenario, combined; must stay above 95%)
        run: |
          for f in tests/scenarios/*.py; do python -m coverage run -p "$f" > /dev/null; done
          python -m coverage combine
          python -m coverage report -m --fail-under=95

  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      # Pinned: a new ruff release can change formatting and fail the check.
      - run: pip install ruff==0.17.2
      - run: ruff check --output-format=github custom_components tests
      - run: ruff format --check custom_components tests

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-06-08
        with:
          category: integration
