name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: Tests (fake bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install aiohttp voluptuous coverage
      - run: python -m unittest discover -s tests -v
      - name: Coverage (each scenario, combined; must stay above 95%)
        run: |
          for f in tests/scenarios/*.py; do python -m coverage run -p "$f" > /dev/null; done
          python -m coverage combine
          python -m coverage report -m --fail-under=95

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github custom_components tests

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
